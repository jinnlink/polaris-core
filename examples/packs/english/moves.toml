[[move]]
id = "recall"
task_type = "recall"
template = "Recall the English/CEFR role of {concept}; give one minimal example and name the cue you used."

[[move]]
id = "explain"
task_type = "free_explain"
template = "Explain how {concept} changes meaning or appropriateness in English, and contrast it with a nearby form."

[[move]]
id = "apply"
task_type = "apply"
template = "Use {concept} in a new sentence or short reply, then mark the word, grammar choice, or register cue that makes it work."

[[move]]
id = "analyze"
task_type = "analyze"
template = "Analyze two English examples involving {concept}; identify the difference in meaning, form, or context."

[[move]]
id = "evaluate"
task_type = "evaluate"
template = "Evaluate an English learner answer using {concept}; decide what is correct, what is misleading, and why."

[[move]]
id = "create"
task_type = "create"
template = "Create a short English response that deliberately uses {concept}, with enough context to show the intended meaning."

[[move]]
id = "transfer"
task_type = "transfer"
template = "Transfer {concept} to a different topic, register, or audience, and explain which cue stayed stable."
