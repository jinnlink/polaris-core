[package]
name = "polaris-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "polaris"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
polaris-core = { path = "../polaris-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
